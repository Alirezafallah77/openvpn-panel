name: Ubuntu installation and real VPN
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  vpn:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [ssh, https, upgrade]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable TUN and install a fresh instance
        run: |
          sudo modprobe tun
          # Only this disposable runner: exercise a fresh-server installation.
          sudo ufw disable
          echo 'integration-only-password-123' | sudo tee /root/panel-test-password >/dev/null
          sudo chmod 600 /root/panel-test-password
          set -o pipefail
          ARGS=()
          if [[ '${{ matrix.mode }}' == https ]]; then ARGS+=(--domain panel.example.invalid); fi
          INSTALLER=scripts/install.sh
          if [[ '${{ matrix.mode }}' == upgrade ]]; then
            git fetch --depth=1 origin e7557018bba2c7f9cfecd02c3061d3bf1e4f1be5
            mkdir /tmp/legacy-panel
            git archive FETCH_HEAD | tar -x -C /tmp/legacy-panel
            INSTALLER=/tmp/legacy-panel/scripts/install.sh
          fi
          sudo bash "$INSTALLER" --endpoint 192.0.2.1 --password-file /root/panel-test-password "${ARGS[@]}" 2>&1 | tee /tmp/panel-install.log
      - name: Upgrade actual v0.1 data and verify CA/users survive
        if: matrix.mode == 'upgrade'
        run: |
          BEFORE=$(sudo sha256sum /etc/openvpn-panel/pki/ca.key)
          sudo /opt/openvpn-panel/.venv/bin/python - <<'PYCODE'
          import sys
          sys.path.insert(0,'/opt/openvpn-panel')
          from quota import Quotas
          q=Quotas('/var/lib/openvpn-panel/quota.sqlite')
          q.create_user('upgrade-check',10000,30)
          q.connect('upgrade-check','legacy-session',now=100)
          q.account('legacy-session',100,200,now=101)
          q.set_enabled('upgrade-check',False)
          PYCODE
          sudo bash scripts/upgrade.sh
          AFTER=$(sudo sha256sum /etc/openvpn-panel/pki/ca.key)
          test "$BEFORE" = "$AFTER"
          sudo /opt/openvpn-panel/.venv/bin/python - <<'PYCODE'
          import sys
          sys.path.insert(0,'/opt/openvpn-panel')
          from quota import Quotas
          q=Quotas('/var/lib/openvpn-panel/quota.sqlite')
          u=q.status('upgrade-check')
          assert (u.used_bytes,u.first_connected,u.days,u.enabled)==(300,100,30,False)
          with q._db() as db:
              db.execute('DELETE FROM sessions')
              db.execute("DELETE FROM users WHERE name='upgrade-check'")
          PYCODE
      - name: Refuse reinstall without overwriting CA
        run: |
          BEFORE=$(sudo sha256sum /etc/openvpn-panel/pki/ca.key)
          if sudo bash scripts/install.sh --endpoint 192.0.2.1 --password-file /root/panel-test-password; then
            echo 'Unsafe reinstall unexpectedly succeeded'; exit 1
          fi
          AFTER=$(sudo sha256sum /etc/openvpn-panel/pki/ca.key)
          test "$BEFORE" = "$AFTER"
      - name: Configure private test HTTPS CA (no public DNS or ACME required)
        if: matrix.mode == 'https'
        run: |
          echo '127.0.0.1 panel.example.invalid' | sudo tee -a /etc/hosts
          sudo sed -i '/reverse_proxy/i\    tls internal' /etc/caddy/Caddyfile
          sudo systemctl restart caddy
          echo 'PANEL_TEST_BASE=https://panel.example.invalid' >> "$GITHUB_ENV"
          echo 'PANEL_TEST_CA=/var/lib/caddy/.local/share/caddy/pki/authorities/local/root.crt' >> "$GITHUB_ENV"
          sudo curl --fail --retry 10 --retry-delay 1 --retry-connrefused --cacert /var/lib/caddy/.local/share/caddy/pki/authorities/local/root.crt https://panel.example.invalid/login --noproxy '*' > /dev/null
      - name: Trust private CI certificate for root SSL Management checks
        if: matrix.mode == 'https'
        run: |
          # Only the ephemeral runner trusts this private CA; production uses OS roots.
          sudo systemctl set-environment SSL_CERT_FILE=/var/lib/caddy/.local/share/caddy/pki/authorities/local/root.crt
          sudo systemctl restart openvpn-panel-pki
      - name: Test real VPN and quota enforcement
        run: |
          set -o pipefail
          sudo --preserve-env=PANEL_TEST_BASE,PANEL_TEST_CA /opt/openvpn-panel/.venv/bin/python tests/integration.py 2>&1 | tee /tmp/panel-e2e.log
      - name: Diagnostics (no profiles, tokens or keys)
        if: failure()
        run: |
          sudo systemctl status openvpn-panel openvpn-panel-accounting openvpn-server@panel --no-pager || true
          sudo journalctl -u openvpn-panel -u openvpn-panel-accounting -u openvpn-panel-pki -u openvpn-server@panel --no-pager -n 150
          sudo tail -n 80 /tmp/e2e-client.log || true
      - name: Publish sanitized test diagnostics as a check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo journalctl -u openvpn-panel -u openvpn-panel-accounting -u openvpn-panel-pki -u openvpn-server@panel --no-pager -n 100 > /tmp/panel-services.log
          sudo chmod a+r /tmp/e2e-client.log 2>/dev/null || true
          python3 - <<'PYCODE'
          import json, os, pathlib, subprocess, time
          sections = []
          for filename in ('/tmp/panel-install.log', '/tmp/panel-e2e.log', '/tmp/panel-services.log', '/tmp/e2e-client.log'):
              path = pathlib.Path(filename)
              if path.exists():
                  sections.append('### ' + path.name + '\n```text\n' + path.read_text(errors='replace')[-10000:] + '\n```')
          data = dict(name='VPN integration diagnostics (${{ matrix.mode }})', head_sha=os.environ['GITHUB_SHA'],
                      status='completed', conclusion='neutral',
                      output=dict(title='Ephemeral runner diagnostics', summary='\n'.join(sections).encode('utf-8')[-50000:].decode('utf-8', errors='replace')))
          for attempt in range(3):
              result = subprocess.run(['gh','api','--method','POST','repos/' + os.environ['GITHUB_REPOSITORY'] + '/check-runs', '--input','-'], input=json.dumps(data), text=True, stdout=subprocess.DEVNULL)
              if result.returncode == 0:
                  break
              time.sleep(2)
          else:
              raise SystemExit('Could not publish CI diagnostics')
