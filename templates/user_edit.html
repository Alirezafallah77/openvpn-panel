{% extends 'base.html' %}{% block content %}<section class="action-panel"><h2>✎ ویرایش سهمیهٔ <bdi>{{ user.name }}</bdi></h2><p>مقادیر، سقف کل هستند. مصرف و تاریخ اولین اتصال پاک نمی‌شوند.</p><form method="post" action="{{ url_for('limits',name=user.name) }}"><input type="hidden" name="csrf" value="{{ csrf }}">{% include 'list_context.html' %}<label>حجم کل (GiB)<input type="number" name="gib" min="1" max="100000" value="{{ (user.limit_bytes / 1073741824)|int }}" required></label><label>کل اعتبار از اولین اتصال (روز)<input type="number" name="days" min="1" max="3650" value="{{ user.days }}" required></label><button>ذخیرهٔ تغییرات</button> <a data-action-cancel href="{{ url_for('dashboard',q=search,status=status_filter,per_page=per_page,page=page) }}#users">انصراف و بازگشت</a></form></section>{% endblock %}
